[project]
name = "backlog-crew"
version = "0.1.0"
description = "A crew of Strands agents on AgentCore Runtime that turns a GitHub backlog into pull requests, for any repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.24.2",
    "boto3>=1.43.116",
    "mcp>=2.1.1",
    "pyyaml>=6.0.3",
    "strands-agents>=1.61.1",
]

[project.optional-dependencies]
infra = [
    "aws-cdk-lib>=2.274.0",
    "constructs>=10.8.1",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
